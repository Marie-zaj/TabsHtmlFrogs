<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Frogs</h1>
        <div class="tabs">
            <input type="radio" name="tab" id="tab1" checked>
            <input type="radio" name="tab" id="tab2">
            <input type="radio" name="tab" id="tab3">
            <!-- <input type="radio" name="tab" id="tab4"> -->

            <div class="tab-menu">
                <label for="tab1">Frog with red eyes</label>
                <label for="tab2">Spotted frog</label>
                <label for="tab3">Fragile frog</label>
            </div>

            <div class="tab-content">
                <div class="tab-panel panel1">
                    <img src="images/frog1.jpg" alt="Frog1">
                    <div class="image-text">
                        <h2>Frog with red eyes</h2>
                        <p>A beautiful frog with bright red eyes.</p>
                    </div>
                </div>

                <div class="tab-panel panel2">
                    <img src="images/frog2.jpg" alt="Frog2">
                    <div class="image-text">
                        <h2>Spotted frog</h2>
                        <p>A frog with a unique spotted pattern.</p>
                    </div>
                </div>

                <div class="tab-panel panel3">
                    <img src="images/frog3.jpg" alt="Frog3">
                    <div class="image-text">
                        <h2>Fragile frog</h2>
                        <p>A small frog in its natural habitat.</p>
                    </div>
                </div>

            </div>
        </div>
    </main>
</body>

</html>
